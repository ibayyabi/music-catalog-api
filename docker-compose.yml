version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-music_service_db}
      MYSQL_USER: ${DB_USER:-music_service_db}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Persistent database storage
      - mysql_data:/var/lib/mysql
      # Database initialization scripts and SQL dump
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped
    # Resource limits untuk STB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # Music Catalog API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-api
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # Connect ke MySQL container
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-music_service_db}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-music_service_db}
      DB_TABLE: ${DB_TABLE:-tabel_musik}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-2}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-5}
      API_KEY: ${API_KEY:-change-this-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "${PORT:-3002}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # Resource limits untuk STB
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    # Health check
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes
volumes:
  mysql_data:
    driver: local
