version: '3.8'

services:
  # Music Catalog API Service
  # MySQL dari aaPanel (tidak pakai container MySQL)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-api
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      # Connect ke MySQL di host (aaPanel)
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-music_db}
      DB_TABLE: ${DB_TABLE:-tabel_musik}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-2}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-5}
      API_KEY: ${API_KEY:-change-this-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "${PORT:-3000}:3000"
    # Pakai network mode host agar bisa akses MySQL di sistem
    network_mode: "host"
    restart: unless-stopped
    # Resource limits untuk STB
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    # Health check
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
