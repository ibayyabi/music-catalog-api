version: '3.8'

services:
  # Music Catalog API Service (SQLite - Single Container)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-api
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # SQLite database path (inside container)
      DB_PATH: /app/database/music_catalog.db
      DB_TABLE: ${DB_TABLE:-tracks}
      API_KEY: ${API_KEY:-change-this-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "${PORT:-3002}:3000"
    volumes:
      # Mount database directory for persistence
      - ./database:/app/database
    restart: unless-stopped
    # Reduced resource limits - no MySQL overhead!
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    # Health check
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
