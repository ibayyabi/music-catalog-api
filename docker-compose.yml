version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: music-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-music_db}
      MYSQL_USER: ${DB_USER:-musicuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-musicpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - music-network
    # Resource limits untuk STB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Music Catalog API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-api
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-music_db}
      DB_TABLE: ${DB_TABLE:-tabel_musik}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-2}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-5}
      API_KEY: ${API_KEY:-change-this-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - music-network
    # Resource limits untuk STB
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  mysql_data:


networks:
  music-network:
    driver: bridge
